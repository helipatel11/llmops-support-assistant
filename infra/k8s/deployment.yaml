apiVersion: apps/v1
kind: Deployment

metadata:
  name: support-assistant
  namespace: llmops

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: support-assistant

  template:
    metadata:
      labels:
        app: support-assistant

    spec:
      imagePullSecrets:
        - name: ecr-secret

      # Each pod builds its ChromaDB index at startup (36 chunks, a few seconds), so the
      # image needs no vector store and the index always matches the image's docs/config.
      initContainers:
        - name: ingest
          image: 183631323298.dkr.ecr.us-east-1.amazonaws.com/llmops-support-assistant:v1
          command: ["python", "-m", "llm.rag.ingest"]
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OLLAMA_BASE_URL
              value: "http://$(NODE_IP):11434"
          volumeMounts:
            - name: chroma
              mountPath: /app/llm/chroma_db

      volumes:
        - name: chroma
          emptyDir: {}

      containers:
        - name: support-assistant

          image: 183631323298.dkr.ecr.us-east-1.amazonaws.com/llmops-support-assistant:v1

          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: llmops-config

          env:
            # Ollama runs on the node (systemd), so reach it via the node's IP. The downward
            # API injects it, replacing the hardcoded IP that changed with every new instance.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OLLAMA_BASE_URL
              value: "http://$(NODE_IP):11434"

          volumeMounts:
            - name: chroma
              mountPath: /app/llm/chroma_db

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 30
            periodSeconds: 10
