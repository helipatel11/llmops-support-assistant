apiVersion: apps/v1
kind: Deployment

metadata:
  name: support-assistant
  namespace: llmops

spec:
  # No `replicas`: the HPA owns the pod count. With it here, every `kubectl apply`
  # would reset the HPA's choice back to this number.

  # Zero-downtime rollout: start one new pod, wait until it is Ready (and stays Ready
  # for minReadySeconds), only then remove an old one. A release that never becomes
  # Ready stalls here while the old pods keep serving.
  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 10
  # A stalled rollout is marked failed (ProgressDeadlineExceeded) after this long.
  progressDeadlineSeconds: 240
  # Old ReplicaSets kept for `kubectl rollout undo`.
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: support-assistant

  template:
    metadata:
      labels:
        app: support-assistant

    spec:
      imagePullSecrets:
        - name: ecr-secret

      # Each pod builds its ChromaDB index at startup (36 chunks, a few seconds), so the
      # image needs no vector store and the index always matches the image's docs/config.
      initContainers:
        - name: ingest
          image: support-assistant  # tag set at deploy time: infra/k8s/deploy.sh <git-sha>
          command: ["python", "-m", "llm.rag.ingest"]
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OLLAMA_BASE_URL
              value: "http://$(NODE_IP):11434"
          volumeMounts:
            - name: chroma
              mountPath: /app/llm/chroma_db

      volumes:
        - name: chroma
          emptyDir: {}

      containers:
        - name: support-assistant

          image: support-assistant  # tag set at deploy time: infra/k8s/deploy.sh <git-sha>

          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: llmops-config

          env:
            # Ollama runs on the node (systemd), so reach it via the node's IP. The downward
            # API injects it, replacing the hardcoded IP that changed with every new instance.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OLLAMA_BASE_URL
              value: "http://$(NODE_IP):11434"

          volumeMounts:
            - name: chroma
              mountPath: /app/llm/chroma_db

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          # Readiness: should this pod get traffic? Checks the pod's own index and that
          # Ollama has this release's models (see /ready in app/main.py).
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Liveness: is the process alive? Deliberately does not check dependencies,
          # or an Ollama outage would restart every pod in a loop without fixing anything.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
