apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-assistant
  namespace: llmops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: support-assistant

  template:
    metadata:
      labels:
        app: support-assistant

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: support-assistant
          image: 183631323298.dkr.ecr.us-east-1.amazonaws.com/llmops-support-assistant:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: llmops-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
