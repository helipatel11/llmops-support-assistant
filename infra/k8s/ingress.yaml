apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llmops-ingress
  namespace: llmops
spec:
  ingressClassName: traefik

  # Prometheus is NOT exposed (it has no login); use:
  #   kubectl -n llmops port-forward svc/prometheus 9090:9090
  rules:
  - http:
      paths:

      - path: /health
        pathType: Prefix
        backend:
          service:
            name: support-assistant
            port:
              number: 80

      - path: /
        pathType: Prefix
        backend:
          service:
            name: support-assistant
            port:
              number: 80

      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
