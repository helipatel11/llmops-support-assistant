apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: support-assistant
  namespace: llmops

spec:
  ingressClassName: traefik

  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: support-assistant

            port:
              number: 80
