apiVersion: v1
data:
  alerts.yml: |
    # Alert rules, shared by the local stack and k3s (`make k8s-prometheus`).
    # No Alertmanager: firing alerts show in Prometheus (/alerts, the ALERTS metric) and on
    # the dashboard. Their timestamps are the "detected at" time in the rollback drill.
    groups:
      - name: support-assistant
        rules:
          # Per endpoint, user-facing endpoints only. Probe traffic (/health, /ready) would
          # dilute the ratio, and /ask failing completely at 1 req / 4 s is only ~5% of all
          # traffic when /predict runs at 5 req/s, so a global ratio could miss it.
          - alert: EndpointErrorRatioHigh
            expr: |
              (
                sum by (handler) (rate(http_requests_total{handler=~"/predict|/ask", status=~"5.*"}[1m]))
                /
                sum by (handler) (rate(http_requests_total{handler=~"/predict|/ask"}[1m]))
              ) > 0.05
            for: 1m
            labels:
              severity: page
            annotations:
              summary: "{{ $labels.handler }}: {{ $value | humanizePercentage }} of requests fail (5xx)"

          - alert: VectorIndexBroken
            expr: min(rag_index_ok) == 0
            for: 1m
            labels:
              severity: page
            annotations:
              summary: "A pod's ChromaDB index does not match its retrieval config"

          - alert: AppTargetDown
            expr: up{job="support-assistant"} == 0
            for: 1m
            labels:
              severity: page
            annotations:
              summary: "Prometheus cannot scrape {{ $labels.instance }}"
  prometheus.yml: |
    # k3s Prometheus config. `make k8s-prometheus` turns this + alerts.yml into
    # infra/k8s/prometheus-config.yaml. The local docker-compose config is prometheus.yml.
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      # One target per support-assistant pod (not the Service), so per-pod counters
      # are not mixed and every replica is visible.
      - job_name: "support-assistant"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["llmops"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: support-assistant
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:8000"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: prometheus-config
  namespace: llmops
