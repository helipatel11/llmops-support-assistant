# Same provisioning as the local stack (monitoring/grafana/provisioning), for k3s.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: llmops
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: llmops
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: support-assistant
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
