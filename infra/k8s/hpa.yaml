apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: support-assistant-hpa
  namespace: llmops

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: support-assistant

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70