apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: llmops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000

          env:
            # IMPORTANT: fixes /grafana subpath issue
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana"

            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"