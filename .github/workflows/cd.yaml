name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    # Deploy only after a successful CI run for a push to main (not for pull requests),
    # and only when DEPLOY_ENABLED=true. Off by default: the security group allows SSH
    # only from the admin IP, so GitHub-hosted runners cannot reach the node. Deploys run
    # from the admin machine with infra/k8s/deploy.sh <sha>. Turning this on needs a
    # self-hosted runner or a pull-based GitOps agent (Argo CD / Flux) on the cluster,
    # not opening SSH to the internet.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    env:
      IMAGE: 183631323298.dkr.ecr.us-east-1.amazonaws.com/llmops-support-assistant:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy the image built by CI
        run: |
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -s -- "$IMAGE" << 'EOF'
          set -e
          kubectl -n llmops set image deployment/support-assistant ingest="$1" support-assistant="$1"
          kubectl -n llmops annotate deployment/support-assistant --overwrite \
            kubernetes.io/change-cause="CD: $1"
          kubectl -n llmops rollout status deployment/support-assistant --timeout=180s
          EOF
