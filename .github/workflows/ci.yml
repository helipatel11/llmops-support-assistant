name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 183631323298.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: llmops-support-assistant

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build-and-push:
    # Tests gate the push; images are only pushed from main. The AWS stack (ECR repo, CI
    # role) only exists during a deploy session, so pushing is switched on with the repo
    # variable ECR_PUSH_ENABLED=true while it is up (otherwise every merge fails red).
    needs: test
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.ECR_PUSH_ENABLED == 'true'
    runs-on: ubuntu-latest

    # OIDC: GitHub issues a short-lived token that AWS trades for temporary credentials
    # of the llmops-github-ci role (infra/terraform/iam.tf). No AWS keys stored in GitHub.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::183631323298:role/llmops-github-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image tagged with the commit SHA
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            --push .
