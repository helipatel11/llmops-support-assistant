# Alert rules, shared by the local stack and k3s (`make k8s-prometheus`).
# No Alertmanager: firing alerts show in Prometheus (/alerts, the ALERTS metric) and on
# the dashboard. Their timestamps are the "detected at" time in the rollback drill.
groups:
  - name: support-assistant
    rules:
      # Per endpoint, user-facing endpoints only. Probe traffic (/health, /ready) would
      # dilute the ratio, and /ask failing completely at 1 req / 4 s is only ~5% of all
      # traffic when /predict runs at 5 req/s, so a global ratio could miss it.
      - alert: EndpointErrorRatioHigh
        expr: |
          (
            sum by (handler) (rate(http_requests_total{handler=~"/predict|/ask", status=~"5.*"}[1m]))
            /
            sum by (handler) (rate(http_requests_total{handler=~"/predict|/ask"}[1m]))
          ) > 0.05
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.handler }}: {{ $value | humanizePercentage }} of requests fail (5xx)"

      - alert: VectorIndexBroken
        expr: min(rag_index_ok) == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "A pod's ChromaDB index does not match its retrieval config"

      - alert: AppTargetDown
        expr: up{job="support-assistant"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.instance }}"
